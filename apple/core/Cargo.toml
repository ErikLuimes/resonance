[package]
name = "phosphor-apple"
description = "Headless Phosphor engine and UniFFI surface for the Resonance macOS app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "phosphor_apple"
# staticlib: linked into PhosphorCore.framework by Xcode.
# lib: lets `cargo test` and the headless example use the crate directly.
crate-type = ["staticlib", "lib"]
# Upstream is a binary crate, so its doc examples have never been compiled
# (c64_emu/c64.rs has one that doesn't build). Unit tests still run.
doctest = false

[features]
# The upstream engine sources gate their USB-hardware paths on this feature.
# Declared so those cfgs aren't "unexpected"; never enable it — the USB
# modules (sid_direct, usb_bridge, daemon_installer) aren't included here, so
# the build fails loudly instead of silently pulling in the bridge daemon.
usb = []

[dependencies]
# tokio: async FFI methods run on UniFFI's tokio runtime (library queries
# do blocking disk work via spawn_blocking).
uniffi = { workspace = true, features = ["tokio"] }

# Fingerprints: one SQLite file next to the session; bundled so the build
# doesn't depend on the SDK's sqlite headers.
rusqlite = { version = "0.41", features = ["bundled"] }
# Scan workers run at utility QoS (pthread_set_qos_class_self_np).
libc = "0.2"

# The reSIDfp engine: libsidplayfp + libresidfp, rendered from the audio
# callback (see ../residfp-sys).
residfp-sys = { path = "../residfp-sys" }

# ── Mirrors of the root Cargo.toml ───────────────────────────────────────────
# Same versions and features as ../../Cargo.toml for the engine sources this
# crate includes via #[path]. When an upstream merge adds a dependency to one
# of those files, the build fails with "unresolved crate" — add it here.
crossbeam-channel = "0.5"
mos6502 = "0.8"
usbsid-pico-config = { version = "0.2", default-features = false, features = ["fpgasid"] }
resid-rs = { git = "https://github.com/sandlbn/resid-rs" }
cpal = "0.15"
fundsp = "0.23"
sidlite-sys = "0.1.1"
sidplayfp-sys = "0.1.4"
ultimate64 = "0.5"
url = "2.5"
rand = "0.8"
md5 = "0.7"
walkdir = "2"
nucleo-matcher = "0.3"
mp3lame-encoder = "0.2.4"
tokio = { version = "1.49.0", features = ["rt", "fs", "io-util", "macros", "time"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.21"
# hvsc_sync.rs imports `iced::futures::StreamExt` — see ../iced-shim.
iced = { package = "phosphor-iced-shim", path = "../iced-shim" }
