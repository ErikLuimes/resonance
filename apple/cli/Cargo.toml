[package]
name = "resonance-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Control Resonance from the terminal"

[[bin]]
name = "resonance"
path = "src/main.rs"

# The MCP server alone, signed into the App Sandbox (scripts/build-cli.sh).
[[bin]]
name = "resonance-mcp"
path = "src/mcp_main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
