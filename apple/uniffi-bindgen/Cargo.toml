[package]
name = "uniffi-bindgen"
description = "Swift binding generator for phosphor-apple (kept out of the core crate so it doesn't link the engine)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }
