<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radial, a Resonance visualizer</title>
  <meta name="description" content="A ring of spectrum bars per voice. One of twelve in Resonance, a Mac player for Commodore 64 music.">
  <link rel="canonical" href="https://erikluimes.github.io/resonance/v/radial/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Radial, a Resonance visualizer">
  <meta property="og:description" content="A ring of spectrum bars per voice. One of twelve in Resonance, a Mac player for Commodore 64 music.">
  <meta property="og:url" content="https://erikluimes.github.io/resonance/v/radial/">
  <meta property="og:image" content="https://erikluimes.github.io/resonance/assets/cards/radial.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="64x64" href="../../assets/favicon-64.png">
  <!-- Written by design/site-sharing/make-cards.py. Link previews read the
       tags above; people go straight on to the visualizer on the site. -->
  <script>
    // Counted first (GoatCounter's pixel; previews don't run this, people do),
    // then on to the site: at once if the count is slow, never on localhost.
    const go = () => location.replace('../../#vis-radial');
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') go();
    else {
      const pixel = new Image();
      pixel.onload = pixel.onerror = go;
      pixel.src = 'https://erikluimes.goatcounter.com/count?p=' + encodeURIComponent('/v/radial/')
        + '&t=' + encodeURIComponent(document.title) + '&r=' + encodeURIComponent(document.referrer);
      setTimeout(go, 400);
    }
  </script>
  <style>body { margin: 0; min-height: 100vh; display: grid; place-content: center; background: #07080d; color: #f3f4f8;
    font: 16px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; } a { color: #3fd0e8; }</style>
</head>
<body>
  <p><a href="../../#vis-radial">Radial in Resonance</a></p>
</body>
</html>
