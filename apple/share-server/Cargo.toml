[package]
name = "resonance-share-server"
description = "Serves Resonance's shared tune links: a page with Open Graph tags and a rendered preview card"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace: the app's (../Cargo.toml) never builds the server, and
# the server never builds the engine.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
base64 = "0.22"
jpeg-encoder = "0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
