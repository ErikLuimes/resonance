# Cargo workspace for the native macOS app (Resonance).
#
# Deliberately separate from the root `phosphor` package: the engine sources
# under ../src are compiled into `phosphor-apple` via `#[path]` includes, so
# nothing upstream (src/, the root Cargo.toml / Cargo.lock, CI) has to change.
[workspace]
resolver = "2"
members = ["core", "iced-shim", "residfp-sys", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
# The included upstream sources are edition 2021; 2024 would reject them.
edition = "2021"
publish = false

[workspace.dependencies]
# Exact pin: the bindgen binary and the scaffolding must agree on the
# metadata format, which changes between UniFFI releases.
uniffi = { version = "=0.32.2", default-features = false }

# Same profiles as the root Cargo.toml — unoptimised builds make the real-time
# DSP and reSID fall behind the player's frame clock.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# A workspace member, so "*" doesn't cover it: the reSIDfp engine's Rust
# wrapper (its C++ sets -O3 itself).
[profile.dev.package.residfp-sys]
opt-level = 3

# resid-rs's resampler multiplies past i32 range (sampler.rs:297). Release
# builds wrap silently — which is what Phosphor ships — but debug builds
# panic with "attempt to multiply with overflow" and kill the player thread
# on the reSID engine. Match release behaviour for that one crate.
[profile.dev.package.resid-rs]
overflow-checks = false
