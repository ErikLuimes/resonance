const norm=v=>{const m=Math.hypot(...v);return v.map(x=>x/m)};

// One long line of letters in the stars' space, passing right to left. Each phrase

const right=[Math.cos(REF_YAW),0,-Math.sin(REF_YAW)],forward=[Math.sin(REF_YAW),0,Math.cos(REF_YAW)];
const ALONG=norm([1,.24,-.44]),SIDE=[0,-.45,3.7],STEP=1.76,SPACE=.95,READ_SPEED=6,TILT=.22,ARRIVES=3.8;
const places=[];{let x=0;for(const k of LINE){places.push(x);x+=k===' '?SPACE:STEP}}
const START=5.2,AT=i=>START+places[i],NAME_AT=THANKS.length+3;
const CAMERA_STARTS=(AT(THANKS.length-1)-ARRIVES)/READ_SPEED,LETTERS_START=(AT(NAME_AT)-ARRIVES)/READ_SPEED;

const add=(a,b,k)=>a.map((v,i)=>v+b[i]*k);

// How far something has turned: its rate grows in from nothing when it starts, holds,
// then eases out to nothing as the stars settle, keeping where it got to.
function turned(s,rate,from){const a=Math.max(0,Math.min(s,SETTLE_FROM)-from),b=Math.max(0,Math.min(SETTLE,s-SETTLE_FROM));return rate*(a*a/(a+1.6)+b-b*b/(2*SETTLE))}
// What the camera adds to the stars: turning against the text until the camera starts,
// so they drift the other way, then rolling through the wild part.
