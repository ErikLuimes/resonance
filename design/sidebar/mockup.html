<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance sidebar: machines and the icon rail (mockup 2)</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --c64: #8f83e6;   /* the C64's light blue, lifted for dark backgrounds */
  --amiga: #f08a24; /* Workbench orange */
  --wide: 248px; --rail: 56px;
}
[data-theme="dark"] {
  --wall: #07080b; --window: #17181d; --side: #111217; --stroke: rgba(255,255,255,.09);
  --t1: #ececf1; --t2: rgba(236,236,241,.62); --t3: rgba(236,236,241,.38);
  --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.10); --hair: rgba(255,255,255,.08);
  --accent: #9d8cff; --pop: #23252c; --skeleton: rgba(255,255,255,.06);
  --shadow: 0 30px 70px rgba(0,0,0,.6);
}
[data-theme="light"] {
  --wall: #c9ccd4; --window: #ffffff; --side: #f1f1f4; --stroke: rgba(0,0,0,.12);
  --t1: #1c1c20; --t2: rgba(28,28,32,.64); --t3: rgba(28,28,32,.42);
  --hover: rgba(0,0,0,.045); --sel: rgba(0,0,0,.09); --hair: rgba(0,0,0,.09);
  --accent: #5b45d6; --pop: #ffffff; --skeleton: rgba(0,0,0,.06);
  --shadow: 0 30px 70px rgba(0,0,0,.25);
  --c64: #5a4bc4; --amiga: #c96a10;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--wall); color: var(--t1); font: 13px/18px var(--font); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 20px 20px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }

/* Mockup controls: not part of the app */
.stage { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 12px; color: #fff; }
.stage .grp { display: flex; align-items: center; gap: 2px; background: rgba(0,0,0,.5); padding: 3px; border-radius: 8px; }
.stage .grp span { padding: 0 8px 0 6px; opacity: .6; }
.stage button { padding: 3px 10px; border-radius: 5px; }
.stage button:hover { background: rgba(255,255,255,.12); }
.stage button.on { background: rgba(255,255,255,.24); }

/* Window */
.win { width: min(1180px, 100%); flex: 1; min-height: 560px; max-height: 800px; background: var(--window); border: 1px solid var(--stroke);
  border-radius: 14px; box-shadow: var(--shadow); display: flex; overflow: hidden; }

/* Sidebar */
.side { width: var(--wide); flex: none; background: var(--side); border-right: 1px solid var(--stroke); display: flex; flex-direction: column;
  transition: width .24s cubic-bezier(.3,.7,.2,1); overflow: hidden; position: relative; }
.win.rail .side { width: 0; border-right-width: 0; }
.chrome { height: 50px; flex: none; display: flex; align-items: center; padding: 0 12px 0 18px; gap: 8px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.toggle { margin-left: auto; width: 28px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--t2); }
.toggle:hover { background: var(--hover); color: var(--t1); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* Full sidebar */
.full { width: var(--wide); padding: 0 10px 14px; }
.row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--t1); width: 100%; text-align: left; font-size: 13.5px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row svg.i { color: var(--t2); }
.row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font: 11px var(--mono); color: var(--t3); letter-spacing: .04em; }
.row .now { color: var(--accent); }
.noicons .full .row > svg.i:first-child { display: none; }
.head { display: flex; align-items: center; gap: 8px; height: 26px; margin-top: 16px; padding: 0 10px; font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t3); width: 100%; text-align: left; }
.head .name { flex: 1; }
.head.machine { color: var(--t1); border-radius: 7px; }
.head.machine:hover { background: var(--hover); }
.head .chev { color: var(--t3); opacity: 0; transition: transform .18s, opacity .15s; }
.head.machine:hover .chev, .head.machine.closed .chev { opacity: 1; }
.head.machine.closed .chev { transform: rotate(-90deg); }
.head .act { color: var(--accent); letter-spacing: .1em; }
.tile { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 9px var(--font); letter-spacing: 0;
  color: var(--tint); background: color-mix(in srgb, var(--tint) 20%, transparent); flex: none; }
.group { overflow: hidden; }
.group.closed { display: none; }

/* Icon rail */
/* Below the toolbar, at the leading edge of the content: the window buttons stay clear of it at any width. */
.railv { width: var(--rail); flex: none; display: none; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 14px;
  background: var(--side); border-right: 1px solid var(--stroke); overflow-y: auto; scrollbar-width: none; }
.win.rail .railv { display: flex; }
.barlead { display: none; align-items: center; gap: 10px; margin-right: 6px; }
.win.rail .barlead { display: flex; }
.barlead .toggle { margin-left: 4px; }
.under { flex: 1; min-height: 0; display: flex; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rbtn { width: 40px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--t2); position: relative; flex: none; }
.rbtn:hover { background: var(--hover); color: var(--t1); }
.rbtn.sel { background: var(--sel); color: var(--t1); }
.rbtn.now::after { content: ""; position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--side); }
.rbtn .tile { width: 24px; height: 24px; border-radius: 7px; font-size: 11px; }
.rbtn.mach { margin-top: 2px; }
.rbtn.mach.closed .tile { opacity: .7; }
.rsep { width: 28px; height: 1px; background: var(--hair); margin: 7px 0; flex: none; }

/* Floating bits */
.tip { position: fixed; z-index: 20; background: var(--pop); border: 1px solid var(--stroke); border-radius: 6px; padding: 3px 8px; font-size: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; white-space: nowrap; transform: translateY(-50%); }
.fly { position: fixed; z-index: 19; background: var(--pop); border: 1px solid var(--stroke); border-radius: 10px; padding: 6px; min-width: 220px;
  box-shadow: 0 14px 40px rgba(0,0,0,.45); }
.fly .ft { font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t3); padding: 4px 10px 6px; }
.fly .row.new { color: var(--accent); }
.ctx { min-width: 170px; z-index: 21; }
.ctx i { display: block; height: 1px; background: var(--hair); margin: 5px 8px; }
.ctx .row { height: 26px; }
.row.drop, .rbtn.drop { background: var(--accent); color: #fff; }
.row.drop svg.i, .row.drop .meta { color: #fff; }
.pt { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 700 9.5px var(--font); color: #fff; }
.art-lg { width: 44px; height: 44px; border-radius: 10px; display: inline-grid; place-items: center; color: #fff; vertical-align: middle; margin-right: 14px; }
.art-lg svg.i { width: 22px; height: 22px; }
.body .title input { font: inherit; color: inherit; background: var(--hover); border: 1px solid var(--accent); border-radius: 7px; padding: 2px 8px; width: 60%; outline: none; }
.line[draggable] { cursor: grab; }
[hidden] { display: none !important; }

/* Placeholder content: only here to judge the sidebar in context */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bar { height: 50px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--hair); }
.bar .crumb { color: var(--t3); font-size: 12px; }
.bar h1 { font-size: 14px; font-weight: 600; margin: 0; }
.bar .sp { flex: 1; }
.pill { height: 24px; border-radius: 6px; background: var(--skeleton); }
.body { flex: 1; min-height: 0; padding: 22px 24px; display: flex; flex-direction: column; gap: 0; overflow: hidden; }
.body .title { font-size: 26px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 4px; }
.body .sub { color: var(--t2); margin-bottom: 18px; }
.line { display: flex; gap: 16px; align-items: center; height: 34px; border-bottom: 1px solid var(--hair); }
.line b { height: 9px; border-radius: 5px; background: var(--skeleton); display: block; }
.play { height: 64px; flex: none; border-top: 1px solid var(--hair); display: flex; align-items: center; gap: 12px; padding: 0 18px; color: var(--t3); font-size: 12px; }
.play .art { width: 38px; height: 38px; border-radius: 8px; background: var(--skeleton); }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="win" id="win">
  <aside class="side">
    <div class="chrome">
      <div class="lights"><i></i><i></i><i></i></div>
      <button class="toggle" data-act="rail" data-tip="Collapse Sidebar to Icons" id="collapse"></button>
    </div>
    <div class="scroll">
      <div class="full" id="full"></div>
    </div>
  </aside>
  <section class="main">
    <div class="bar"><span class="barlead"><span class="lights"><i></i><i></i><i></i></span><button class="toggle" data-act="rail" data-tip="Show Sidebar"></button></span><span class="crumb" id="crumb"></span><h1 id="h1"></h1><span class="sp"></span>
      <span class="pill" style="width:96px"></span><span class="pill" style="width:78px"></span><span class="pill" style="width:28px"></span></div>
    <div class="under">
      <div class="railv" id="railv"></div>
      <div class="col">
        <div class="body"><div class="title" id="title"></div><div class="sub" id="sub"></div><div id="lines"></div></div>
        <div class="play"><span class="art"></span><span>Player bar (unchanged)</span></div>
      </div>
    </div>
  </section>
</div>

<div class="tip" id="tip" hidden></div>
<div class="fly" id="fly" hidden></div>
<div class="fly ctx" id="ctx" hidden>
  <button class="row">Play</button><i></i>
  <button class="row">Rename</button><button class="row">Duplicate</button><button class="row">Export…</button><button class="row">Show in Finder</button><i></i>
  <button class="row">Delete…</button>
</div>

<script>
const ICON = {
  search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>',
  clock: '<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.5"/>',
  heart: '<path d="M8 13.4S2.4 10 2.4 6.2A3 3 0 0 1 8 4.7a3 3 0 0 1 5.6 1.5C13.6 10 8 13.4 8 13.4z"/>',
  smart: '<path d="M7 2.5l1.2 3.3L11.5 7 8.2 8.2 7 11.5 5.8 8.2 2.5 7l3.3-1.2z"/><path d="M12.4 10.2l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5z"/>',
  list: '<path d="M2.5 4h7M2.5 8h5.5M2.5 12h3.5"/><path d="M12.2 11.8V4.6l2-.7"/><circle cx="11" cy="11.9" r="1.3"/>',
  collection: '<rect x="2.2" y="3" width="11.6" height="10" rx="2.2"/><path d="M2.2 9h3l1 1.6h3.6l1-1.6h3"/>',
  person: '<circle cx="8" cy="5.4" r="2.6"/><path d="M3 13.5c.5-2.9 2.4-4 5-4s4.5 1.1 5 4"/>',
  game: '<rect x="1.5" y="4.8" width="13" height="7" rx="3.5"/><path d="M5.2 7v2.6M3.9 8.3h2.6"/><circle cx="10.4" cy="9" r=".5"/><circle cx="12" cy="7.6" r=".5"/>',
  demo: '<rect x="2" y="3" width="12" height="8.4" rx="1.8"/><path d="M5.8 13.6h4.4"/><path d="M7 5.6l3 1.6-3 1.6z"/>',
  star: '<path d="M8 2.4l1.7 3.5 3.9.5-2.8 2.7.7 3.8L8 11.1l-3.5 1.8.7-3.8-2.8-2.7 3.9-.5z"/>',
  group: '<circle cx="6" cy="6" r="2.1"/><path d="M2 13c.3-2.4 1.9-3.5 4-3.5s3.7 1.1 4 3.5"/><circle cx="11.6" cy="6.4" r="1.6"/><path d="M11.8 9.7c1.4.1 2.4 1 2.7 2.7"/>',
  doc: '<path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3"/>',
  sidebar: '<rect x="2" y="3" width="12" height="10" rx="2.2"/><path d="M6.2 3v10"/>',
  chev: '<path d="M4.5 6.2 8 9.8l3.5-3.6"/>',
  speaker: '<path d="M2.8 6.4h2.1L8 3.9v8.2L4.9 9.6H2.8z"/><path d="M10.4 5.9a3 3 0 0 1 0 4.2"/>',
  plus: '<path d="M8 3.5v9M3.5 8h9"/>',
};
const svg = n => `<svg class="i" viewBox="0 0 16 16">${ICON[n]}</svg>`;

// One model, drawn twice: the full sidebar and the rail.
const MODEL = [
  { items: [{ id: 'search', name: 'Search', icon: 'search' }] },
  { title: 'Library', items: [
    { id: 'recent', name: 'Recently Played', icon: 'clock' },
    { id: 'fav', name: 'Favorites', icon: 'heart', meta: '3' },
  ]},
  { machine: 'c64', title: 'Commodore 64', mono: '64', tint: 'var(--c64)', items: [
    { id: 'c64-home', name: 'Collection', icon: 'collection', meta: 'HVSC 85' },
    { id: 'c64-mus', name: 'Musicians', icon: 'person' },
    { id: 'c64-games', name: 'Games', icon: 'game' },
    { id: 'c64-demos', name: 'Demos', icon: 'demo' },
    { id: 'c64-cur', name: 'Curated Playlists', icon: 'star', meta: '35' },
  ]},
  { machine: 'amiga', title: 'Amiga', mono: 'A', tint: 'var(--amiga)', items: [
    { id: 'ami-home', name: 'Collection', icon: 'collection' },
    { id: 'ami-comp', name: 'Composers', icon: 'person' },
    { id: 'ami-groups', name: 'Groups', icon: 'group' },
    { id: 'ami-formats', name: 'Formats', icon: 'doc' },
  ]},
  { title: 'Playlists', action: 'New', items: [
    { id: 'smart', name: 'Smart Playlist', icon: 'smart' },
    // In the rail these fold into one Playlists button with a menu.
    { id: 'pl1', name: 'My Playlist', icon: 'list', fold: 'Playlists' },
    { id: 'pl2', name: 'HVSC Top 100 in 2000', icon: 'list', meta: '100', fold: 'Playlists', now: true },
    { id: 'pl3', name: 'Hubbard Loud', icon: 'list', meta: '24', fold: 'Playlists' },
  ]},
];

const state = { rail: false, icons: true, amiga: true, theme: 'dark', sel: 'c64-mus', closed: {}, tiles: false, naming: null };
const GRADS = ['#9d8cff,#3fd0e8', '#f08a24,#e8468a', '#3fd0a0,#3f7fe8', '#e8c53f,#e8663f', '#c08cff,#e84a9a'];
const isList = it => it.fold === 'Playlists';
const canDrop = id => id === 'fav' || (find(id) && isList(find(id).it));
const grad = it => GRADS[MODEL.flatMap(s => s.items).filter(isList).indexOf(it) % GRADS.length];
const initials = it => it.name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const $ = id => document.getElementById(id);
const sections = () => MODEL.filter(s => s.machine !== 'amiga' || state.amiga);
const find = id => { for (const s of MODEL) for (const it of s.items) if (it.id === id) return { s, it }; };

function drawFull() {
  $('full').innerHTML = sections().map(s => {
    const closed = s.machine && state.closed[s.machine];
    let head = '';
    if (s.machine) head = `<button class="head machine ${closed ? 'closed' : ''}" data-mach="${s.machine}" style="--tint:${s.tint}">
        <span class="tile">${s.mono}</span><span class="name">${s.title}</span><span class="chev">${svg('chev')}</span></button>`;
    else if (s.title) head = `<div class="head"><span class="name">${s.title}</span>${s.action ? `<button class="act new">${s.action}</button>` : ''}</div>`;
    const rows = s.items.map(it => `<button class="row ${it.id === state.sel ? 'sel' : ''}" data-id="${it.id}">${svg(it.icon)}
        <span class="name">${it.name}</span>${it.now ? `<span class="now">${svg('speaker')}</span>` : ''}${it.meta ? `<span class="meta">${it.meta}</span>` : ''}</button>`).join('');
    return head + `<div class="group ${closed ? 'closed' : ''}">${rows}</div>`;
  }).join('');
}

function drawRail() {
  let html = '';
  sections().forEach((s, n) => {
    if (n > 0 && !(s.machine && sections()[n - 1].machine)) html += '<div class="rsep"></div>';
    if (s.machine) {
      const holds = s.items.some(it => it.id === state.sel);
      html += `<button class="rbtn mach ${holds ? 'sel' : ''}" data-fold="${s.machine}" data-tip="${s.title}" style="--tint:${s.tint}"><span class="tile">${s.mono}</span></button>`;
      return;
    }
    const folds = {};
    s.items.forEach(it => {
      if (it.fold) {
        if (!folds[it.fold]) {
          folds[it.fold] = true;
          const holds = s.items.some(x => x.fold === it.fold && x.id === state.sel);
          const playing = !state.tiles && s.items.some(x => x.fold === it.fold && x.now);
          html += `<button class="rbtn ${holds && !state.tiles ? 'sel' : ''} ${playing ? 'now' : ''}" data-fold="${it.fold}" data-tip="${it.fold}${playing ? ' (one is playing)' : ''}">${svg(it.icon)}</button>`;
        }
        if (state.tiles) html += `<button class="rbtn ${it.id === state.sel ? 'sel' : ''} ${it.now ? 'now' : ''}" data-id="${it.id}" data-tip="${it.name}${it.now ? ' (playing)' : ''}"><span class="pt" style="background:linear-gradient(135deg,${grad(it)})">${initials(it)}</span></button>`;
        return;
      }
      html += `<button class="rbtn ${it.id === state.sel ? 'sel' : ''} ${it.now ? 'now' : ''}" data-id="${it.id}" data-tip="${it.name}${it.now ? ' (playing)' : ''}">${svg(it.icon)}</button>`;
    });
  });
  $('railv').innerHTML = html;
}

function drawMain() {
  const { s, it } = find(state.sel);
  $('crumb').textContent = s.machine ? s.title + '  ›' : '';
  $('h1').textContent = it.name;
  if (isList(it)) {
    const name = state.naming === it.id ? `<input id="naming" value="${it.name}">` : `<span>${it.name}</span>`;
    $('title').innerHTML = `<span class="art-lg" style="background:linear-gradient(135deg,${grad(it)})">${svg('list')}</span>${name}`;
  } else $('title').textContent = it.name;
  $('sub').textContent = isList(it) ? `${it.meta || 'No'} tunes · drag a row below onto a playlist` : s.machine ? `${s.title} · placeholder content` : 'All machines · placeholder content';
  const w = [[34, 22, 8], [28, 18, 8], [40, 26, 8], [24, 20, 8], [36, 16, 8], [30, 24, 8], [38, 20, 8], [26, 22, 8], [32, 18, 8], [36, 24, 8], [28, 20, 8]];
  $('lines').innerHTML = w.map(r => `<div class="line" draggable="true">${r.map(p => `<b style="width:${p}%"></b>`).join('')}</div>`).join('');
}

function drawStage() {
  const grp = (label, key, opts) => `<div class="grp"><span>${label}</span>${opts.map(([v, t]) =>
    `<button data-key="${key}" data-val="${v}" class="${String(state[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  $('stage').innerHTML =
    grp('Sidebar', 'rail', [[false, 'Full'], [true, 'Icons']]) +
    grp('Row icons', 'icons', [[true, 'On'], [false, 'Off']]) +
    grp('Machines', 'amiga', [[false, 'C64 only'], [true, 'C64 + Amiga']]) +
    grp('Theme', 'theme', [['dark', 'Dark'], ['light', 'Light']]);
}

function draw() {
  if (!state.amiga && find(state.sel).s.machine === 'amiga') state.sel = 'c64-home';
  document.documentElement.dataset.theme = state.theme;
  $('win').classList.toggle('rail', state.rail);
  $('win').classList.toggle('noicons', !state.icons);
  document.querySelectorAll('.toggle').forEach(t => t.innerHTML = svg('sidebar'));
  hideFloats(); drawStage(); drawFull(); drawRail(); drawMain();
}

function hideFloats() { $('tip').hidden = true; $('fly').hidden = true; $('ctx').hidden = true; }

function openFly(btn, fold) {
  const machine = MODEL.find(s => s.machine === fold);
  const items = machine ? machine.items : MODEL.flatMap(s => s.items).filter(it => it.fold === fold);
  $('fly').innerHTML = `<div class="ft">${machine ? machine.title : fold}</div>` + items.map(it =>
    `<button class="row ${it.id === state.sel ? 'sel' : ''}" data-id="${it.id}">${svg(it.icon)}<span class="name">${it.name}</span>${it.now ? `<span class="now">${svg('speaker')}</span>` : ''}${it.meta ? `<span class="meta">${it.meta}</span>` : ''}</button>`).join('') +
    (machine ? '' : `<button class="row new">${svg('plus')}<span class="name">New Playlist</span></button>`);
  const r = btn.getBoundingClientRect();
  $('fly').style.left = r.right + 10 + 'px';
  $('fly').style.top = r.top - 8 + 'px';
  $('fly').hidden = false; $('tip').hidden = true;
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  $('ctx').hidden = true;
  if (!b) return hideFloats();
  if (b.classList.contains('new')) return newPlaylist();
  if (b.dataset.key) { const v = b.dataset.val; state[b.dataset.key] = v === 'true' ? true : v === 'false' ? false : v; return draw(); }
  if (b.dataset.act === 'rail') { state.rail = !state.rail; return draw(); }
  if (b.dataset.mach) { state.closed[b.dataset.mach] = !state.closed[b.dataset.mach]; return draw(); }
  if (b.dataset.fold) return $('fly').hidden ? openFly(b, b.dataset.fold) : hideFloats();
  if (b.dataset.id) { state.sel = b.dataset.id; return draw(); }
});
document.addEventListener('mouseover', e => {
  const b = e.target.closest('[data-tip]');
  if (!b || !$('fly').hidden) { $('tip').hidden = true; return; }
  const r = b.getBoundingClientRect();
  $('tip').textContent = b.dataset.tip;
  $('tip').style.left = r.right + 10 + 'px';
  $('tip').style.top = r.top + r.height / 2 + 'px';
  $('tip').hidden = false;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideFloats(); });

// New Playlist: it opens with its name ready to type, in the content. The sidebar stays as it is.
function newPlaylist() {
  const lists = MODEL.find(s => s.title === 'Playlists').items;
  const it = { id: 'pl' + (lists.length + 1) + Date.now(), name: 'New Playlist', icon: 'list', meta: '', fold: 'Playlists' };
  lists.push(it);
  state.sel = it.id; state.naming = it.id;
  draw();
  const field = $('naming'); field.focus(); field.select();
}
function endNaming(e) {
  if (e.target.id !== 'naming' || state.naming === null) return;
  if (e.type === 'keydown' && e.key !== 'Enter') return;
  find(state.naming).it.name = e.target.value.trim() || 'New Playlist';
  state.naming = null; draw();
}
document.addEventListener('keydown', endNaming);
document.addEventListener('focusout', endNaming);

// Right-click a playlist, in the sidebar or in the rail's menu.
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('[data-id]');
  if (!row || !isList(find(row.dataset.id).it)) return;
  e.preventDefault();
  $('ctx').style.left = e.clientX + 'px'; $('ctx').style.top = e.clientY + 'px';
  $('ctx').hidden = false; $('tip').hidden = true;
});

// Dragging tunes: over the rail's Playlists icon the menu springs open; a playlist or Favorites takes the drop.
let dropOn = null;
const mark = el => { if (dropOn !== el) { dropOn && dropOn.classList.remove('drop'); dropOn = el; el && el.classList.add('drop'); } };
document.addEventListener('dragstart', e => { if (e.target.classList.contains('line')) e.dataTransfer.setData('text/plain', 'tune'); });
document.addEventListener('dragover', e => {
  const spring = e.target.closest('#railv [data-fold="Playlists"]');
  if (spring && $('fly').hidden) openFly(spring, 'Playlists');
  const row = e.target.closest('[data-id]');
  if (row && canDrop(row.dataset.id)) { e.preventDefault(); mark(row); } else mark(null);
});
document.addEventListener('drop', e => {
  const row = e.target.closest('[data-id]');
  if (!row || !canDrop(row.dataset.id)) return;
  e.preventDefault();
  const it = find(row.dataset.id).it;
  it.meta = String((parseInt(it.meta, 10) || 0) + 1);
  dropOn = null; draw();
});
document.addEventListener('dragend', () => { mark(null); hideFloats(); });
draw();
</script>
</body>
</html>
