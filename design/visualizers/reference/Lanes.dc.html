<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SID compact lanes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#a27cf6}a:hover{color:#c4adff}
</style>
</helmet>
<div style="width: 1040px; height: 360px; box-sizing: border-box; padding: 24px; background: #1c1c20; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #e8e8ec">
<div style="height: 100%; box-sizing: border-box; background: #0b0b0c; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 12px; letter-spacing: 0.14em; color: #9a9aa3">VOICES</span>
<span style="font-size: 11px; color: #6f6f78">scope · note · key · level</span>
</div>
<button onClick="{{toggle}}" style="font-family: inherit; font-size: 12px; color: #d8d8de; background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 8px; padding: 0 14px; height: 32px; cursor: pointer">{{runLabel}}</button>
</div>
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<div style="flex: 1; display: flex; align-items: center; gap: 16px; background: #111113; border-radius: 12px; padding: 0 16px 0 0; overflow: hidden">
<div style="width: 4px; align-self: stretch; background: {{v.color}}"></div>
<div style="width: 92px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 11px; letter-spacing: 0.12em; color: #a3a3ac">{{v.name}}</span>
<span style="font-size: 11px; color: {{v.color}}">{{v.short}}</span>
</div>
<div style="flex: 1; height: 52px; background: #060607; border-radius: 8px; position: relative; overflow: hidden">
<svg viewBox="0 0 300 52" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
<line x1="0" y1="26" x2="300" y2="26" stroke="#ffffff" stroke-opacity="0.08" vector-effect="non-scaling-stroke"></line>
<polyline points="{{v.pts}}" fill="none" stroke="{{v.color}}" stroke-opacity="0.25" stroke-width="5" vector-effect="non-scaling-stroke"></polyline>
<polyline points="{{v.pts}}" fill="none" stroke="{{v.color}}" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline>
</svg>
</div>
<span style="width: 64px; text-align: right; font-size: 24px; font-weight: 700; color: {{v.noteColor}}">{{v.note}}</span>
<div style="width: 140px; height: 44px; position: relative">
<div style="display: flex; gap: 2px; height: 100%">
<sc-for list="{{v.whites}}" as="k" hint-placeholder-count="7">
<div style="flex: 1; background: {{k.bg}}; border-radius: 0 0 4px 4px"></div>
</sc-for>
</div>
<sc-for list="{{v.blacks}}" as="k" hint-placeholder-count="5">
<div style="position: absolute; top: 0; left: {{k.left}}%; width: 10%; height: 26px; margin-left: -5%; background: {{k.bg}}; border-radius: 0 0 3px 3px; border: 1px solid #0b0b0c; box-sizing: border-box"></div>
</sc-for>
</div>
<div style="width: 170px; display: flex; gap: 3px; height: 22px">
<sc-for list="{{v.segs}}" as="s" hint-placeholder-count="20">
<div style="flex: 1; border-radius: 2px; background: {{s.bg}}"></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":360}}'>
class Component extends DCLogic {
  constructor(...a) { super(...a); this.state = { t: 0, run: true }; }
  componentDidMount() { this.iv = setInterval(() => { if (this.state.run) this.setState({ t: this.state.t + 1 }); }, 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  data() {
    return [
      { name: 'VOICE 1', wave: 'PULSE', short: 'PUL · 42%', color: '#4fd1c5', pw: 0.42, seq: [36,36,48,36,43,43,55,43,46,46,58,46,41,41,53,41], env: [1,0.85,0.75,0.7] },
      { name: 'VOICE 2', wave: 'SAWTOOTH', short: 'SAW', color: '#a27cf6', pw: 0.5, seq: [63,63,65,67,70,70,67,65,63,62,63,65,67,null,63,62], env: [0.6,1,0.92,0.86] },
      { name: 'VOICE 3', wave: 'NOISE', short: 'NOI', color: '#f2a154', pw: 0.5, seq: [86,null,74,null,86,86,74,null,86,null,74,null,86,null,74,74], env: [1,0.45,0.18,0.05] }
    ];
  }
  nn(m) { const N = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; return m == null ? '—' : N[m % 12] + (Math.floor(m / 12) - 1); }
  rnd(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  w(type, x, pw, i) { x = x - Math.floor(x); if (type === 'PULSE') return x < pw ? 1 : -1; if (type === 'SAWTOOTH') return 2 * x - 1; if (type === 'TRIANGLE') return 1 - 4 * Math.abs(x - 0.5); return this.rnd(i) * 2 - 1; }
  renderVals() {
    const t = this.state.t;
    const voices = this.data().map((v) => {
      const m = v.seq[Math.floor(t / 4) % 16], age = t % 4, gate = m != null, lvl = gate ? v.env[age] : 0.04;
      const cyc = v.wave === 'NOISE' ? 1 : Math.min(9, 3 + (gate ? (m - 30) / 8 : 0));
      const p = [];
      for (let i = 0; i < 200; i++) {
        const x = i / 199;
        p.push((x * 300).toFixed(1) + ',' + (26 - this.w(v.wave, x * cyc + t * 0.11, v.pw, Math.floor(t * 997 + i * 3)) * lvl * 20).toFixed(1));
      }
      const pc = gate ? m % 12 : -1;
      const whites = [0, 2, 4, 5, 7, 9, 11].map((n) => ({ bg: n === pc ? v.color : '#d9d9de' }));
      const blacks = [[1, 1], [3, 2], [6, 4], [8, 5], [10, 6]].map(([n, wi]) => ({ left: ((wi / 7) * 100).toFixed(2), bg: n === pc ? v.color : '#26262b' }));
      const lit = Math.round(lvl * 20);
      const segs = Array.from({ length: 20 }, (_, i) => ({ bg: i < lit ? (i === lit - 1 ? '#f4f4f6' : v.color) : '#1d1d21' }));
      return { name: v.name, short: v.short, color: v.color, pts: p.join(' '), note: this.nn(m), noteColor: gate ? v.color : '#55555c', whites, blacks, segs };
    });
    return { voices, toggle: () => this.setState({ run: !this.state.run }), runLabel: this.state.run ? 'Pause' : 'Play' };
  }
}
</script>
</body>
</html>
