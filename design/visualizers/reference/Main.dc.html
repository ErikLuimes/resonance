<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SID oscilloscope</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#a27cf6}a:hover{color:#c4adff}
</style>
</helmet>
<div style="width: 1040px; height: 460px; box-sizing: border-box; padding: 24px; background: #1c1c20; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #e8e8ec">
<div style="height: 100%; box-sizing: border-box; background: #0b0b0c; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 12px; letter-spacing: 0.14em; color: #9a9aa3">OSCILLOSCOPE</span>
<span style="font-size: 11px; color: #6f6f78">per-voice output · 50 Hz</span>
</div>
<button onClick="{{toggle}}" style="font-family: inherit; font-size: 12px; color: #d8d8de; background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 8px; padding: 0 14px; height: 32px; cursor: pointer">{{runLabel}}</button>
</div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<div style="background: {{v.dim}}; border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{v.gateColor}}; box-shadow: 0 0 8px {{v.gateGlow}}"></span>
<span style="font-size: 11px; letter-spacing: 0.12em; color: #a3a3ac">{{v.name}}</span>
</div>
<span style="font-size: 11px; letter-spacing: 0.08em; color: {{v.color}}">{{v.waveLabel}}</span>
</div>
<div style="height: 210px; border-radius: 10px; background: #060607; position: relative; overflow: hidden">
<svg viewBox="0 0 300 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
<line x1="0" y1="50" x2="300" y2="50" stroke="#ffffff" stroke-opacity="0.05" vector-effect="non-scaling-stroke"></line>
<line x1="0" y1="100" x2="300" y2="100" stroke="#ffffff" stroke-opacity="0.12" vector-effect="non-scaling-stroke"></line>
<line x1="0" y1="150" x2="300" y2="150" stroke="#ffffff" stroke-opacity="0.05" vector-effect="non-scaling-stroke"></line>
<line x1="75" y1="0" x2="75" y2="200" stroke="#ffffff" stroke-opacity="0.05" vector-effect="non-scaling-stroke"></line>
<line x1="150" y1="0" x2="150" y2="200" stroke="#ffffff" stroke-opacity="0.05" vector-effect="non-scaling-stroke"></line>
<line x1="225" y1="0" x2="225" y2="200" stroke="#ffffff" stroke-opacity="0.05" vector-effect="non-scaling-stroke"></line>
<polyline points="{{v.pts}}" fill="none" stroke="{{v.color}}" stroke-opacity="0.25" stroke-width="7" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
<polyline points="{{v.pts}}" fill="none" stroke="{{v.color}}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
</svg>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 30px; font-weight: 700; color: {{v.color}}; line-height: 1">{{v.note}}</span>
<span style="font-size: 11px; color: #8a8a93">{{v.hz}}</span>
</div>
<div style="width: 96px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
<span style="font-size: 11px; color: #8a8a93">{{v.extra}}</span>
<div style="width: 96px; height: 4px; border-radius: 2px; background: #222227; overflow: hidden">
<div style="height: 100%; width: {{v.lvlPct}}%; background: {{v.color}}"></div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":460}}'>
class Component extends DCLogic {
  constructor(...a) { super(...a); this.state = { t: 0, run: true }; }
  componentDidMount() { this.iv = setInterval(() => { if (this.state.run) this.setState({ t: this.state.t + 1 }); }, 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  data() {
    return [
      { name: 'VOICE 1', wave: 'PULSE', color: '#4fd1c5', dim: '#0e1c1b', pw: 0.42, seq: [36,36,48,36,43,43,55,43,46,46,58,46,41,41,53,41], env: [1,0.85,0.75,0.7] },
      { name: 'VOICE 2', wave: 'SAWTOOTH', color: '#a27cf6', dim: '#16122a', pw: 0.5, seq: [63,63,65,67,70,70,67,65,63,62,63,65,67,null,63,62], env: [0.6,1,0.92,0.86] },
      { name: 'VOICE 3', wave: 'NOISE', color: '#f2a154', dim: '#21170d', pw: 0.5, seq: [86,null,74,null,86,86,74,null,86,null,74,null,86,null,74,74], env: [1,0.45,0.18,0.05] }
    ];
  }
  nn(m) { const N = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; return m == null ? '—' : N[m % 12] + (Math.floor(m / 12) - 1); }
  hz(m) { return m == null ? 0 : 440 * Math.pow(2, (m - 69) / 12); }
  rnd(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  w(type, x, pw, i) { x = x - Math.floor(x); if (type === 'PULSE') return x < pw ? 1 : -1; if (type === 'SAWTOOTH') return 2 * x - 1; if (type === 'TRIANGLE') return 1 - 4 * Math.abs(x - 0.5); return this.rnd(i) * 2 - 1; }
  at(v, t) { const st = Math.floor(t / 4), age = t % 4, m = v.seq[st % 16]; return { m, age, gate: m != null, lvl: m == null ? 0.05 : v.env[age] }; }
  scope(v, s, t, W, H) {
    const N = 180, cyc = v.wave === 'NOISE' ? 1 : Math.min(5, 1.4 + (s.m == null ? 0 : (s.m - 30) / 14));
    const p = [];
    for (let i = 0; i < N; i++) {
      const x = i / (N - 1);
      const y = H / 2 - this.w(v.wave, x * cyc + t * 0.11, v.pw, Math.floor(t * 997 + i * 3)) * s.lvl * (H / 2 - 12);
      p.push((x * W).toFixed(1) + ',' + y.toFixed(1));
    }
    return p.join(' ');
  }
  renderVals() {
    const t = this.state.t;
    const voices = this.data().map((v) => {
      const s = this.at(v, t);
      return {
        name: v.name, color: v.color, dim: v.dim, waveLabel: v.wave,
        gateColor: s.gate ? v.color : '#34343a', gateGlow: s.gate ? v.color : 'transparent',
        pts: this.scope(v, s, t, 300, 200),
        note: this.nn(s.m), hz: s.gate ? this.hz(s.m).toFixed(1) + ' Hz' : 'gate off',
        extra: v.wave === 'PULSE' ? 'PW ' + Math.round(v.pw * 100) + '%' : 'LVL ' + Math.round(s.lvl * 100),
        lvlPct: Math.round(s.lvl * 100)
      };
    });
    return { voices, toggle: () => this.setState({ run: !this.state.run }), runLabel: this.state.run ? 'Pause' : 'Play' };
  }
}
</script>
</body>
</html>
