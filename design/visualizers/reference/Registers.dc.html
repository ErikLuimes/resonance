<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SID register view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#a27cf6}a:hover{color:#c4adff}
</style>
</helmet>
<div style="width: 1040px; height: 640px; box-sizing: border-box; padding: 24px; background: #1c1c20; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #e8e8ec">
<div style="height: 100%; box-sizing: border-box; background: #0b0b0c; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 12px; letter-spacing: 0.14em; color: #9a9aa3">REGISTERS</span>
<span style="font-size: 11px; color: #6f6f78">$D400–$D41C · frame {{frame}}</span>
</div>
<button onClick="{{toggle}}" style="font-family: inherit; font-size: 12px; color: #d8d8de; background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 8px; padding: 0 14px; height: 32px; cursor: pointer">{{runLabel}}</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<div style="background: #111113; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: {{v.color}}">{{v.name}}</span>
<span style="font-size: 10px; color: #6a6a73">{{v.base}}</span>
</div>
<sc-for list="{{v.regs}}" as="r" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) 28px 46px; align-items: center; gap: 8px; height: 26px; padding: 0 6px; border-radius: 6px; background: {{r.bg}}">
<span style="font-size: 11px; color: #62626b">{{r.addr}}</span>
<span style="font-size: 11px; color: #9a9aa3">{{r.name}}</span>
<span style="font-size: 13px; font-weight: 700; color: {{r.fg}}">{{r.hex}}</span>
<div style="height: 4px; border-radius: 2px; background: #1f1f24; overflow: hidden">
<div style="height: 100%; width: {{r.pct}}%; background: {{v.color}}; opacity: 0.8"></div>
</div>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 5px; padding: 6px 6px 2px; border-radius: 6px; background: {{v.ctrlBg}}">
<div style="display: flex; justify-content: space-between">
<div style="display: flex; gap: 8px">
<span style="font-size: 11px; color: #62626b">{{v.ctrlAddr}}</span>
<span style="font-size: 11px; color: #9a9aa3">CTRL</span>
</div>
<span style="font-size: 13px; font-weight: 700; color: {{v.ctrlFg}}">{{v.ctrlHex}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; padding-bottom: 4px">
<sc-for list="{{v.bits}}" as="b" hint-placeholder-count="8">
<span style="font-size: 9px; text-align: center; padding: 3px 0; border-radius: 4px; background: {{b.bg}}; color: {{b.fg}}; font-weight: 700">{{b.k}}</span>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>

<div style="flex: 1; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px">
<div style="background: #111113; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; padding: 0 6px 6px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #e0e0e5">FILTER &amp; VOLUME</span>
<span style="font-size: 10px; color: #6a6a73">$D415</span>
</div>
<sc-for list="{{filt}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 48px 82px 28px minmax(0, 1fr); align-items: center; gap: 8px; height: 26px; padding: 0 6px; border-radius: 6px; background: {{r.bg}}">
<span style="font-size: 11px; color: #62626b">{{r.addr}}</span>
<span style="font-size: 11px; color: #9a9aa3">{{r.name}}</span>
<span style="font-size: 13px; font-weight: 700; color: {{r.fg}}">{{r.hex}}</span>
<span style="font-size: 11px; color: #8a8a93; text-align: right">{{r.note}}</span>
</div>
</sc-for>
</div>
<div style="background: #111113; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; padding: 0 6px 6px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #e0e0e5">READ-ONLY</span>
<span style="font-size: 10px; color: #6a6a73">$D419</span>
</div>
<sc-for list="{{ro}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 48px 50px 28px minmax(0, 1fr); align-items: center; gap: 8px; height: 26px; padding: 0 6px; border-radius: 6px; background: {{r.bg}}">
<span style="font-size: 11px; color: #62626b">{{r.addr}}</span>
<span style="font-size: 11px; color: #9a9aa3">{{r.name}}</span>
<span style="font-size: 13px; font-weight: 700; color: {{r.fg}}">{{r.hex}}</span>
<div style="height: 4px; border-radius: 2px; background: #1f1f24; overflow: hidden">
<div style="height: 100%; width: {{r.pct}}%; background: #f2a154; opacity: 0.8"></div>
</div>
</div>
</sc-for>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":640}}'>
class Component extends DCLogic {
  constructor(...a) { super(...a); this.state = { t: 0, run: true }; this.prev = {}; this.chg = {}; }
  componentDidMount() { this.iv = setInterval(() => { if (this.state.run) this.setState({ t: this.state.t + 1 }); }, 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  data() {
    return [
      { name: 'VOICE 1', color: '#4fd1c5', rgb: '79,209,197', wbit: 0x40, seq: [36,36,48,36,43,43,55,43,46,46,58,46,41,41,53,41], env: [1,0.85,0.75,0.7] },
      { name: 'VOICE 2', color: '#a27cf6', rgb: '162,124,246', wbit: 0x20, seq: [63,63,65,67,70,70,67,65,63,62,63,65,67,null,63,62], env: [0.6,1,0.92,0.86] },
      { name: 'VOICE 3', color: '#f2a154', rgb: '242,161,84', wbit: 0x80, seq: [86,null,74,null,86,86,74,null,86,null,74,null,86,null,74,74], env: [1,0.45,0.18,0.05] }
    ];
  }
  hex(n, w) { return n.toString(16).toUpperCase().padStart(w, '0'); }
  rnd(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  pw1(t) { return 0.1 + 0.4 * (0.5 + 0.5 * Math.sin(t * 0.03)); }
  cutoff(t) { const age = t % 4; return Math.round(0x200 + (0.5 + 0.5 * Math.sin(t * 0.0125)) * 0x500 + 0x100 * Math.exp(-age)); }
  // remember when a register last changed so the cell can flash
  track(addr, val, t, rgb) {
    if (this.prev[addr] !== val) { this.prev[addr] = val; this.chg[addr] = t; }
    const heat = Math.max(0, 1 - (t - (this.chg[addr] ?? -99)) / 6);
    return { bg: heat > 0 ? `rgba(${rgb},${(heat * 0.22).toFixed(3)})` : 'transparent', fg: heat > 0.5 ? '#ffffff' : '#c9c9d1' };
  }
  renderVals() {
    const t = this.state.t, s = Math.floor(t / 4) % 16, age = t % 4;
    const V = this.data();
    const lastV3 = (() => { for (let k = 0; k < 16; k++) { const m = V[2].seq[(s - k + 16) % 16]; if (m != null) return m; } return 86; })();
    const voices = V.map((v, i) => {
      const base = 0xD400 + i * 7;
      const m = v.seq[s], held = m == null ? (i === 2 ? lastV3 : v.seq[(s + 15) % 16] ?? 60) : m;
      const gate = i === 0 ? age !== 3 : i === 1 ? m != null : m != null && age < 2;
      const freq = Math.round(this.hz(held) * 16777216 / 985248) & 0xffff;
      const pw = i === 0 ? Math.round(this.pw1(t) * 4095) : i === 1 ? 0x800 : 0;
      const ad = i === 0 ? 0x09 : i === 1 ? 0x46 : (lastV3 === 86 ? 0x00 : 0x05);
      const sr = i === 0 ? 0xA0 : i === 1 ? 0xD5 : (lastV3 === 86 ? 0x50 : 0x02);
      const ctrl = v.wbit | (gate ? 1 : 0);
      const vals = [['FREQ LO', freq & 0xff], ['FREQ HI', freq >> 8], ['PW LO', pw & 0xff], ['PW HI', pw >> 8], ['AD', ad], ['SR', sr]];
      const offs = [0, 1, 2, 3, 5, 6];
      const regs = vals.map(([name, val], k) => {
        const addr = base + offs[k], f = this.track(addr, val, t, v.rgb);
        return { addr: '$' + this.hex(addr, 4), name, hex: this.hex(val, 2), pct: Math.round((val / 255) * 100), bg: f.bg, fg: f.fg };
      });
      const cf = this.track(base + 4, ctrl, t, v.rgb);
      const bits = ['NOI', 'PUL', 'SAW', 'TRI', 'TST', 'RNG', 'SYN', 'GAT'].map((k, b) => {
        const on = (ctrl >> (7 - b)) & 1;
        return { k, bg: on ? v.color : '#1b1b1f', fg: on ? '#0b0b0c' : '#55555d' };
      });
      return { name: v.name, color: v.color, base: '$' + this.hex(base, 4), regs, bits, ctrlAddr: '$' + this.hex(base + 4, 4), ctrlHex: this.hex(ctrl, 2), ctrlBg: cf.bg, ctrlFg: cf.fg };
    });
    const cut = this.cutoff(t), res = Math.floor(t / 128) % 2 ? 0xC : 0xA;
    const fvals = [
      [0xD415, 'FC LO', cut & 7, 'cutoff ' + this.hex(cut, 3)],
      [0xD416, 'FC HI', cut >> 3, Math.round((cut / 2047) * 100) + '%'],
      [0xD417, 'RES/FILT', (res << 4) | 0x03, 'res ' + this.hex(res, 1) + ' · V1 V2'],
      [0xD418, 'MODE/VOL', 0x1F, 'LP · vol F']
    ];
    const filt = fvals.map(([addr, name, val, note]) => { const f = this.track(addr, val, t, '232,232,236'); return { addr: '$' + this.hex(addr, 4), name, hex: this.hex(val, 2), note, bg: f.bg, fg: f.fg }; });
    const s3 = V[2].seq[s], env3 = s3 == null ? 0 : Math.round(V[2].env[age] * 255);
    const osc3 = Math.floor(this.rnd(t + 1) * 256);
    const rvals = [[0xD419, 'POTX', 0], [0xD41A, 'POTY', 0], [0xD41B, 'OSC3', osc3], [0xD41C, 'ENV3', env3]];
    const ro = rvals.map(([addr, name, val]) => { const f = this.track(addr, val, t, '242,161,84'); return { addr: '$' + this.hex(addr, 4), name, hex: this.hex(val, 2), pct: Math.round((val / 255) * 100), bg: f.bg, fg: f.fg }; });
    return { voices, filt, ro, frame: String(t).padStart(5, '0'), toggle: () => this.setState({ run: !this.state.run }), runLabel: this.state.run ? 'Pause' : 'Play' };
  }
}
</script>
</body>
</html>
