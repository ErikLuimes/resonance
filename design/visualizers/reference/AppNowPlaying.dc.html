<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resonance – Now Playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4c9bff}a:hover{color:#7ab4ff}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #0d0c14 0%, #040405 65%); color: #ececf0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif">

<svg viewBox="0 0 1440 900" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-label="{{modeLabel}} visualizer" role="img">
<defs>
<filter id="npglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"></feGaussianBlur></filter>
<filter id="npsoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
</defs>
<sc-if value="{{isHalo}}" hint-placeholder-val="{{true}}">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<path d="{{v.blob}}" fill="{{v.color}}" fill-opacity="0.16" filter="url(#npglow)" style="mix-blend-mode: screen"></path>
<path d="{{v.blob}}" fill="none" stroke="{{v.color}}" stroke-opacity="0.6" stroke-width="6" filter="url(#npsoft)" style="mix-blend-mode: screen"></path>
<path d="{{v.blob}}" fill="none" stroke="{{v.color}}" stroke-width="1.8" style="mix-blend-mode: screen"></path>
</sc-for>
</sc-if>
<sc-if value="{{isRadial}}" hint-placeholder-val="{{false}}">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<circle cx="720" cy="410" r="{{v.r0}}" fill="none" stroke="{{v.color}}" stroke-opacity="0.12"></circle>
<path d="{{v.bars}}" stroke="{{v.color}}" stroke-width="4" stroke-linecap="round" fill="none"></path>
</sc-for>
</sc-if>
<sc-if value="{{isParticles}}" hint-placeholder-val="{{false}}">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="20">
<circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" fill="{{d.c}}" fill-opacity="{{d.o}}"></circle>
</sc-for>
</sc-if>
</svg>

<div style="position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
<div style="display: flex; gap: 8px; width: 200px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<div role="tablist" aria-label="Visualizer" style="display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button role="tab" onClick="{{m.pick}}" style="height: 32px; padding: 0 16px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; width: 200px">
<button aria-label="Pop out" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: #c9c9d1; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></button>
<button aria-label="Back to library" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06); color: #c9c9d1; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"></path></svg></button>
</div>
</div>

<div style="position: absolute; left: 56px; bottom: 140px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #8d8e96">NOW PLAYING · PLAYLIST 22 / 65</span>
<span style="font-size: 60px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Lightforce</span>
<span style="font-size: 22px; color: #c9c9d1">Rob Hubbard</span>
<span style="font-size: 15px; color: #8d8e96">1986 · Faster Than Light (FTL)</span>
<div style="display: flex; gap: 6px; margin-top: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 7px; background: rgba(255,255,255,0.07); color: #c9c9d1">{{c.v}}</span>
</sc-for>
</div>
</div>

<div style="position: absolute; right: 56px; bottom: 140px; display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,0.04)">
<span style="font-size: 11px; color: #8d8e96">{{v.label}}</span>
<span style="font-size: 22px; font-weight: 700; color: {{v.noteColor}}; width: 54px; text-align: right">{{v.note}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 56px; right: 56px; bottom: 36px; height: 64px; display: flex; align-items: center; gap: 22px">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Previous" style="width: 40px; height: 40px; border: none; background: transparent; color: #ececf0; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 18V6l-8.5 6 8.5 6Zm.5-6 8.5 6V6l-8.5 6Z"></path></svg></button>
<button onClick="{{toggle}}" aria-label="{{runLabel}}" style="width: 56px; height: 56px; border-radius: 50%; border: none; background: #ececf0; color: #0b0b0c; display: flex; align-items: center; justify-content: center">
<sc-if value="{{run}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8L7 4Z"></path></svg></sc-if>
</button>
<button aria-label="Next" style="width: 40px; height: 40px; border: none; background: transparent; color: #ececf0; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 18l8.5-6L4 6v12Zm9-12v12l8.5-6L13 6Z"></path></svg></button>
</div>
<span style="font-size: 13px; color: #a3a3ab; width: 36px; font-variant-numeric: tabular-nums">{{elapsed}}</span>
<div style="flex: 1; height: 34px; position: relative">
<svg viewBox="0 0 600 30" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-label="Song overview" role="img">
<sc-for list="{{strip}}" as="s" hint-placeholder-count="3">
<path d="{{s.rest}}" fill="{{s.color}}" fill-opacity="0.25"></path>
<path d="{{s.played}}" fill="{{s.color}}"></path>
</sc-for>
<line x1="{{playX}}" y1="0" x2="{{playX}}" y2="30" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke"></line>
</svg>
</div>
<span style="font-size: 13px; color: #a3a3ab; width: 36px">7:14</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { t: 0, run: true, mode: 'halo' };
    const N = 650, ga = Math.PI * (3 - Math.sqrt(5)), poles = [[0, 1, 0], [0.87, -0.5, 0], [-0.87, -0.5, 0]];
    this.P = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = ga * i, x = Math.cos(th) * r, z = Math.sin(th) * r, vi = i % 3, p = poles[vi];
      this.P.push({ x, y, z, vi, lat: Math.asin(y), ang: Math.acos(Math.max(-1, Math.min(1, x * p[0] + y * p[1] + z * p[2]))) });
    }
  }
  componentDidMount() { this.iv = setInterval(() => { if (this.state.run) this.setState({ t: this.state.t + 1 }); }, 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  voicesData() {
    return [
      { label: 'V1 PUL', wave: 'PULSE', color: '#5ac8e8', pw: 0.42, seq: [36,36,48,36,43,43,55,43,46,46,58,46,41,41,53,41], env: [1,0.85,0.75,0.7] },
      { label: 'V2 SAW', wave: 'SAW', color: '#a27cf6', pw: 0.5, seq: [63,63,65,67,70,70,67,65,63,62,63,65,67,null,63,62], env: [0.6,1,0.92,0.86] },
      { label: 'V3 NOI', wave: 'NOISE', color: '#f2a154', pw: 0.5, seq: [86,null,74,null,86,86,74,null,86,null,74,null,86,null,74,74], env: [1,0.45,0.18,0.05] }
    ];
  }
  nn(m) { const N = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; return m == null ? '—' : N[m % 12] + (Math.floor(m / 12) - 1); }
  rnd(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  shape(v, th, t, tf) {
    let s = 0;
    if (v.wave === 'SAW') { for (let k = 2; k <= 10; k++) s += Math.sin(k * th + t * (0.6 + k * 0.08)) / k; }
    else if (v.wave === 'PULSE') { for (let k = 3; k <= 13; k += 2) s += Math.sin(k * th - t * (0.4 + k * 0.05)) * Math.abs(Math.sin(Math.PI * k * v.pw)) / k * 1.6; }
    else { const f = Math.floor(tf); for (let k = 9; k <= 21; k += 3) s += Math.sin(k * th + this.rnd(f * 31 + k) * 6.28) / 3.2; }
    return s;
  }
  act(i, u, k) {
    const brk = u > 0.62 && u < 0.69, out = u > 0.95 ? (1 - u) / 0.05 : 1;
    let a;
    if (i === 0) a = brk ? 0.3 : 0.75 + 0.25 * this.rnd(k * 3 + 1);
    else if (i === 1) a = u < 0.12 ? 0 : brk ? 0.95 : 0.45 + 0.5 * this.rnd(k * 7 + 2);
    else a = u < 0.28 || brk ? 0 : 0.35 + 0.65 * this.rnd(k * 11 + 3);
    return a * out;
  }
  strip(V, frac) {
    const N = 200, W = 600, bw = W / N;
    return V.map((v, i) => {
      let played = '', rest = '';
      for (let k = 0; k < N; k++) {
        const a = this.act(i, k / N, k); if (a <= 0.02) continue;
        const h = 2 + a * 7, y = 1 + i * 10 + (9 - h) / 2;
        const seg = 'M' + (k * bw).toFixed(1) + ' ' + y.toFixed(1) + 'h' + (bw - 0.8).toFixed(2) + 'v' + h.toFixed(1) + 'h-' + (bw - 0.8).toFixed(2) + 'Z';
        if (k / N < frac) played += seg; else rest += seg;
      }
      return { color: v.color, played: played || 'M0 0', rest: rest || 'M0 0' };
    });
  }
  renderVals() {
    const st = this.state, t = st.t, s = Math.floor(t / 4) % 16, age = t % 4, ts = t / 20;
    const V = this.voicesData(), cx = 720, cy = 410;
    const lv = V.map((v) => { const m = v.seq[s]; return { m, lvl: m == null ? 0.04 : v.env[age] }; });
    const voices = V.map((v, i) => {
      const { m, lvl } = lv[i];
      let blob = '', bars = '';
      if (st.mode === 'halo') {
        const R = 190 + i * 22, rot = ts * (0.12 + (m || 40) / 900) * (i % 2 ? -1 : 1), amp = 30 + lvl * 70;
        for (let j = 0; j <= 160; j++) {
          const th = (j / 160) * Math.PI * 2, rr = R + lvl * amp * this.shape(v, th + rot, ts, t) * 0.9 + lvl * 20;
          blob += (j ? 'L' : 'M') + (cx + Math.cos(th) * rr).toFixed(1) + ' ' + (cy + Math.sin(th) * rr).toFixed(1);
        }
        blob += 'Z';
      }
      const r0 = 120 + i * 70;
      if (st.mode === 'radial') {
        const rot = ts * 0.05 * (i % 2 ? -1 : 1);
        for (let side = -1; side <= 1; side += 2) for (let j = 0; j < 48; j++) {
          const th = -Math.PI / 2 + rot + side * ((j + 0.5) / 48) * Math.PI;
          const mag = v.wave === 'NOISE' ? 0.3 + 0.7 * this.rnd(Math.floor(t) * 131 + j) : Math.max(0, Math.sin(j * (0.5 + i * 0.3) + ts * 0.8)) * (1 - j / 60) + 0.1;
          const len = 3 + lvl * mag * 48;
          bars += 'M' + (cx + Math.cos(th) * (r0 + 4)).toFixed(1) + ' ' + (cy + Math.sin(th) * (r0 + 4)).toFixed(1) + 'L' + (cx + Math.cos(th) * (r0 + 4 + len)).toFixed(1) + ' ' + (cy + Math.sin(th) * (r0 + 4 + len)).toFixed(1);
        }
      }
      return { color: v.color, label: v.label, note: this.nn(m), noteColor: m == null ? '#4a4a51' : v.color, blob: blob || 'M0 0', bars: bars || 'M0 0', r0 };
    });
    let dots = [];
    if (st.mode === 'particles') {
      const ry = ts * 0.22, rx = 0.38, cyR = Math.cos(ry), syR = Math.sin(ry), cxR = Math.cos(rx), sxR = Math.sin(rx), R = 250, cam = 900;
      const hit = V.map((v, i) => { for (let k = 0; k < 16; k++) { if (v.seq[(s - k + 16) % 16] != null) return (k * 4 + age) / 20; } return 9; });
      dots = this.P.map((p) => {
        const L = lv[p.vi], since = hit[p.vi], w = p.ang - since * 2.4;
        const d = L.lvl * 0.1 * Math.sin(3 * p.lat * 2 + ts * (1.5 + p.vi * 0.7)) + Math.exp(-(w * w) / 0.035) * 0.28 * Math.exp(-since * 1.4);
        const sc0 = R * (1 + d), x = p.x * sc0, y = p.y * sc0, z = p.z * sc0;
        const x1 = x * cyR + z * syR, z1 = -x * syR + z * cyR, y2 = y * cxR - z1 * sxR, z2 = y * sxR + z1 * cxR;
        const sc = cam / (cam + z2), depth = (1 - z2 / R) * 0.5;
        return { x: (cx + x1 * sc).toFixed(1), y: (cy + y2 * sc).toFixed(1), r: (0.8 + depth * 2.2 + L.lvl).toFixed(2), c: V[p.vi].color, o: Math.min(1, 0.15 + depth * 0.7 + L.lvl * 0.3 * depth).toFixed(2) };
      });
    }
    const ML = [['halo', 'Halo'], ['particles', 'Particles'], ['radial', 'Radial']];
    const modes = ML.map(([id, label]) => ({ label, pick: () => this.setState({ mode: id }), bg: st.mode === id ? 'rgba(255,255,255,0.16)' : 'transparent', fg: st.mode === id ? '#ffffff' : '#a3a3ab' }));
    const secs = (12 + t * 0.05) % 434, frac = secs / 434;
    return {
      voices, dots, modes, modeLabel: (ML.find((m) => m[0] === st.mode) || ML[0])[1],
      isHalo: st.mode === 'halo', isParticles: st.mode === 'particles', isRadial: st.mode === 'radial',
      chips: [{ v: 'PSID' }, { v: '6581' }, { v: 'PAL' }],
      strip: this.strip(V, frac), playX: (frac * 600).toFixed(1),
      elapsed: Math.floor(secs / 60) + ':' + String(Math.floor(secs % 60)).padStart(2, '0'),
      run: st.run, paused: !st.run, runLabel: st.run ? 'Pause' : 'Play', toggle: () => this.setState({ run: !st.run })
    };
  }
}
</script>
</body>
</html>
