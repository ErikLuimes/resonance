<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance 64</title>
<style>
html,body{margin:0;height:100%;background:#09090b;overflow:hidden;font:13px -apple-system,system-ui,sans-serif;color:#8a8a90}
#stage{position:fixed;inset:0;margin:auto;width:min(100vw,120vh);aspect-ratio:6/5}
#case{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#power{position:absolute;left:80.4%;top:77%;width:5.8%;height:6.5%;background:none;border:0;cursor:pointer;padding:0;border-radius:8px}
#power:focus-visible{outline:2px solid #6ea0ff}
#led{position:absolute;left:57.1%;top:78.6%;width:1.33%;aspect-ratio:32/14;border-radius:1vmin;background:transparent;transition:background .06s,box-shadow .12s;pointer-events:none}
#led.on{background:#5cff80;box-shadow:0 0 .35vmin .08vmin #5cff80,0 0 1.1vmin .25vmin rgba(92,255,128,.5)}
#hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;opacity:.55;pointer-events:none}
</style>
<div id="stage">
  <img id="case" src="monitor-1702.png" alt="Commodore 1702 monitor" draggable="false">
  <canvas id="gl"></canvas>
  <div id="led"></div>
  <button id="power" aria-label="Power" title="Power"></button>
</div>
<div id="hint">Click POWER on the monitor. Then: Space play/pause · ⌘→ ⌘← next/previous · ⌥⌘→ ⌥⌘← subtune · ⌘↑ ⌘↓ volume · ↑ ↓ Return pick · ⌥⌘S shuffle · ⇧⌘R surprise · ⌘. stop. Vim keys work too: h j k l L H + - s r x.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------------------------------------------------------------------
// The C64 picture: 384×272 with the border, 40×25 cells of 8×8 at (32,36).
// The two colors are sampled from the reference screenshot (border/text and
// background). Nothing else is ever drawn.
const FW=384,FH=272,OX=32,OY=36,COLS=40,ROWS=25;
const BG=[0x65,0x4d,0xb6], FG=[0x9e,0x8b,0xe1];
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

// Our own 8×8 glyphs in the spirit of the C64's upper-case set. Row bytes, MSB left.
const GLYPHS={
' ':'0000000000000000','!':'1818181800001800','"':'6666660000000000','#':'6666FF66FF666600',
'$':'183E603C067C1800','%':'62660C1830664600','&':'3C663C3867663F00',"'":'060C180000000000',
'(':'0C18303030180C00',')':'30180C0C0C183000','*':'00663CFF3C660000','+':'0018187E18180000',
',':'0000000000181830','-':'0000007E00000000','.':'0000000000181800','/':'0003060C18306000',
'0':'3C666E7666663C00','1':'1818381818187E00','2':'3C66060C30607E00','3':'3C66061C06663C00',
'4':'060E1E667F060600','5':'7E607C0606663C00','6':'3C66607C66663C00','7':'7E660C1818181800',
'8':'3C66663C66663C00','9':'3C66663E06663C00',':':'0000181800181800',';':'0000181800181830',
'<':'0E18306030180E00','=':'00007E007E000000','>':'70180C060C187000','?':'3C66060C18001800',
'@':'3C666E6E60623C00','A':'183C667E66666600','B':'7C66667C66667C00','C':'3C66606060663C00',
'D':'786C6666666C7800','E':'7E60607860607E00','F':'7E60607860606000','G':'3C66606E66663C00',
'H':'6666667E66666600','I':'3C18181818183C00','J':'1E0C0C0C0C6C3800','K':'666C7870786C6600',
'L':'6060606060607E00','M':'63777F6B63636300','N':'66767E7E6E666600','O':'3C66666666663C00',
'P':'7C66667C60606000','Q':'3C666666663C0E00','R':'7C66667C786C6600','S':'3C66603C06663C00',
'T':'7E18181818181800','U':'6666666666663C00','V':'66666666663C1800','W':'6363636B7F776300',
'X':'66663C183C666600','Y':'666666663C181800','Z':'7E060C1830607E00','[':'3C30303030303C00',
']':'3C0C0C0C0C0C3C00','^':'00183C7E18181800','_':'00000000000000FF',
// graphics
'█':'FFFFFFFFFFFFFFFF','▒':'AA55AA55AA55AA55','▄':'00000000FFFFFFFF','▀':'FFFFFFFF00000000',
'─':'000000FFFF000000','■':'007E7E7E7E7E7E00','□':'007E424242427E00','▶':'0060787E7E786000',
'‖':'0066666666666600','♥':'367F7F7F3E1C0800','•':'00003C3C3C3C0000','│':'1818181818181818',
'←':'0010307F7F301000',
};
const keys=Object.keys(GLYPHS), glyphIndex=new Map(keys.map((k,i)=>[k,i]));
const atlas=document.createElement('canvas'); atlas.width=keys.length*8; atlas.height=16;
{
  const g=atlas.getContext('2d'), id=g.createImageData(atlas.width,16), d=id.data;
  keys.forEach((k,i)=>{const h=GLYPHS[k];for(let r=0;r<8;r++){const b=parseInt(h.substr(r*2,2),16);for(let c=0;c<8;c++){const on=(b>>(7-c))&1;for(let rev=0;rev<2;rev++){const col=(on^rev)?FG:BG;const o=(((rev*8+r)*atlas.width)+i*8+c)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;}}}});
  g.putImageData(id,0,0);
}
const toGlyph=ch=>{
  if(glyphIndex.has(ch))return glyphIndex.get(ch);
  const up=ch.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
  return glyphIndex.has(up)?glyphIndex.get(up):glyphIndex.get('?');
};

const frame=document.createElement('canvas'); frame.width=FW; frame.height=FH;
const fctx=frame.getContext('2d');
const cells=new Uint16Array(COLS*ROWS), revs=new Uint8Array(COLS*ROWS);
let dirty=true, cursor=null; // cursor: {x,y} when the BASIC cursor is shown
function cls(){cells.fill(glyphIndex.get(' '));revs.fill(0);dirty=true;}
function put(x,y,s,rev=false){for(const ch of s){if(x>=COLS)break;if(x>=0&&y>=0&&y<ROWS){cells[y*COLS+x]=toGlyph(ch);revs[y*COLS+x]=rev?1:0;}x++;}dirty=true;}
function line(y,s,rev=false){put(0,y,(s+' '.repeat(COLS)).slice(0,COLS),rev);}
function renderFrame(blink){
  fctx.fillStyle=rgb(FG);fctx.fillRect(0,0,FW,FH);
  fctx.fillStyle=rgb(BG);fctx.fillRect(OX,OY,320,200);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const i=y*COLS+x;fctx.drawImage(atlas,cells[i]*8,revs[i]*8,8,8,OX+x*8,OY+y*8,8,8);}
  if(cursor&&blink){const i=cursor.y*COLS+cursor.x;fctx.drawImage(atlas,cells[i]*8,(revs[i]^1)*8,8,8,OX+cursor.x*8,OY+cursor.y*8,8,8);}
}

// ---------------------------------------------------------------------------
// A tiny terminal for the boot: print, newline, scroll, auto-typing.
const term={x:0,y:0,
  nl(){this.x=0;this.y++;if(this.y>=ROWS){cells.copyWithin(0,COLS);revs.copyWithin(0,COLS);for(let x=0;x<COLS;x++){cells[(ROWS-1)*COLS+x]=glyphIndex.get(' ');revs[(ROWS-1)*COLS+x]=0;}this.y=ROWS-1;dirty=true;}},
  print(s){for(const ch of s){if(ch==='\n'){this.nl();continue;}put(this.x,this.y,ch);this.x++;if(this.x>=COLS)this.nl();}},
  showCursor(v){cursor=v?{x:this.x,y:this.y}:null;dirty=true;},
};
let script=[], scriptAt=0, mode='off'; // off | boot | player
function schedule(steps){script=steps;scriptAt=0;}
function typeSteps(text){const out=[];for(const ch of text)out.push({dt:0.06+Math.random()*0.1,fn:()=>{term.print(ch);term.showCursor(true);}});return out;}
function boot(){
  cls();term.x=0;term.y=0;term.showCursor(false);mode='boot';
  const t=performance.now()/1000;
  const steps=[
    {dt:0.05,fn:()=>{term.print('\n    **** RESONANCE 64 SID PLAYER ****\n\n');term.print(` 64K RAM SYSTEM  ${HVSC_TUNES} SID TUNES FREE\n\nREADY.\n`);term.showCursor(true);}},
    {dt:1.1,fn:()=>{}},
    ...typeSteps('LOAD"RESONANCE",8,1'),
    {dt:0.35,fn:()=>{term.showCursor(false);term.nl();}},
    {dt:0.4,fn:()=>{term.print('\nSEARCHING FOR RESONANCE\n');}},
    {dt:1.0,fn:()=>{term.print('LOADING\n');}},
    {dt:1.7,fn:()=>{term.print('READY.\n');term.showCursor(true);}},
    {dt:0.8,fn:()=>{}},
    ...typeSteps('RUN'),
    {dt:0.3,fn:()=>{term.showCursor(false);term.nl();}},
    {dt:0.35,fn:()=>{startPlayer();}},
  ];
  let at=t;for(const s of steps){at+=s.dt;s.at=at;}
  schedule(steps);
}
function runScript(now){while(scriptAt<script.length&&script[scriptAt].at<=now){script[scriptAt].fn();scriptAt++;}}

// ---------------------------------------------------------------------------
// The player screen. In the app this is live data from PlayerStore and the
// visualizer feed; here it's a simulation over tunes from Recently Played.
const HVSC_TUNES=63165;
const TUNES=[
 {title:'International Karate',author:'Rob Hubbard',released:'1986 System 3',secs:646,songs:1},
 {title:'Wizball',author:'Martin Galway',released:'1987 Ocean',secs:215,songs:9},
 {title:'Metal Warrior Ultra',author:'Lasse Öörni (Cadaver) & Jammer',released:'2020 Psytronik/Protovision',secs:197,songs:44},
 {title:'Hessian Upper City Theme',author:'Lasse Öörni (Cadaver)',released:'2013 Covert Bitops',secs:116,songs:1},
 {title:'The Consultant',author:'Lasse Öörni (Cadaver)',released:'2002 Covert Bitops',secs:177,songs:1},
 {title:'Commando',author:'Lasse Öörni (Cadaver)',released:'1999 Cadaver',secs:63,songs:1},
 {title:'Sanxion',author:'Rob Hubbard',released:'1986 Thalamus',secs:335,songs:2},
 {title:'Commando',author:'Rob Hubbard',released:'1985 Elite',secs:236,songs:19},
 {title:'Ghost in Blue',author:'Marco Miotti (4wd-soft)',released:'1987 Systems Editoriale',secs:113,songs:1},
 {title:'Wizardry',author:'Graham Jarvis & Rob Hartshorne',released:'1985 The Edge',secs:61,songs:8},
 {title:'The Last Ninja',author:'Ben Daglish & Anthony Lees',released:'1987 System 3',secs:262,songs:11},
 {title:'Reckless Rufus',author:'David Green',released:'1992 Alternative Software',secs:228,songs:4},
];
const P={index:7,song:1,elapsed:84,state:'playing',volume:8,shuffle:false,surprise:false,selected:7,
  voices:[{wave:'PUL',level:0,peak:0},{wave:'SAW',level:0,peak:0},{wave:'NOI',level:0,peak:0}],step:0,stepAt:0};
function startPlayer(){mode='player';term.showCursor(false);cls();drawPlayer();}
const mmss=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function playIndex(i){P.index=(i+TUNES.length)%TUNES.length;P.song=1;P.elapsed=0;P.state='playing';P.selected=P.index;}
function next(){playIndex(P.shuffle?Math.floor(Math.random()*TUNES.length):P.index+1);}
function prev(){if(P.elapsed>3){P.elapsed=0;return;}playIndex(P.index-1);}
function simulate(dt,now){
  const tune=TUNES[P.index];
  if(P.state==='playing'){P.elapsed+=dt;if(P.elapsed>=tune.secs)next();}
  // Voices: a 16th-note grid at 125 BPM. Lead plays most steps, bass every other, drums on the beat.
  if(P.state==='playing'&&now-P.stepAt>=0.12){P.stepAt=now;P.step=(P.step+1)%16;const v=P.voices;
    if(Math.random()<0.6)v[0].level=0.6+Math.random()*0.4;
    if(P.step%2===0&&Math.random()<0.85)v[1].level=0.7+Math.random()*0.3;
    if(P.step%4===0)v[2].level=1;else if(P.step%4===2&&Math.random()<0.6)v[2].level=0.55;}
  const tau=[0.22,0.16,0.07];
  P.voices.forEach((v,i)=>{v.level*=Math.exp(-dt/(P.state==='playing'?tau[i]:0.05));v.peak=Math.max(v.level,v.peak-dt*1.2);});
}
function drawPlayer(){
  const tune=TUNES[P.index];
  line(0,' RESONANCE 64'.padEnd(29)+'SID PLAYER ',true);
  line(1,'');
  line(2,(P.surprise?' SURPRISE ME':' RECENTLY PLAYED').padEnd(31)+String(TUNES.length).padStart(3)+' TUNES');
  const first=Math.max(0,Math.min(P.selected-4,TUNES.length-10));
  for(let r=0;r<10;r++){const i=first+r;if(i>=TUNES.length){line(3+r,'');continue;}const t=TUNES[i];
    const s=(i===P.selected?'>':' ')+String(i+1).padStart(2)+'. '+t.title;
    line(3+r,s.slice(0,COLS),i===P.index);}
  line(13,'');
  line(14,' PLAYING: '+tune.title);
  line(15,' BY:      '+tune.author);
  line(16,' YEAR:    '+tune.released);
  line(17,(' SONG:    '+P.song+' OF '+tune.songs).padEnd(20)+'TIME: '+mmss(P.elapsed)+' / '+mmss(tune.secs));
  const f=Math.round(36*Math.min(1,P.elapsed/tune.secs));
  line(18,' ['+'█'.repeat(f)+'▒'.repeat(36-f)+']');
  line(19,'');
  P.voices.forEach((v,i)=>{const n=Math.round(v.level*30),pk=Math.round(v.peak*30);let bar='';for(let c=0;c<30;c++)bar+=c<n?'■':(c===pk-1&&pk>n?'□':'.');line(20+i,` V${i+1} ${v.wave} `+bar);});
  line(23,'');
  const st={playing:'PLAYING',paused:'PAUSED ',stopped:'STOPPED'}[P.state];
  line(24,' '+st+'  VOL '+'■'.repeat(P.volume)+'.'.repeat(10-P.volume)+' '+String(P.volume*10).padStart(3)+'%'+(P.shuffle?'  SHUFFLE':''));
}

// ---------------------------------------------------------------------------
// Keys: the app's own set, and the vim set.
addEventListener('keydown',e=>{
  if(mode==='off')return;
  if(e.key==='Meta'||e.key==='Alt'||e.key==='Shift'||e.key==='Control')return;
  if(mode==='boot'){startPlayer();e.preventDefault();return;}
  const k=e.key, meta=e.metaKey, alt=e.altKey; let used=true;
  if(k===' ')P.state=P.state==='playing'?'paused':'playing';
  else if((meta&&alt&&k==='ArrowRight')||k==='L'){P.song=P.song%TUNES[P.index].songs+1;P.elapsed=0;}
  else if((meta&&alt&&k==='ArrowLeft')||k==='H'){P.song=(P.song+TUNES[P.index].songs-2)%TUNES[P.index].songs+1;P.elapsed=0;}
  else if((meta&&k==='ArrowRight')||k==='l')next();
  else if((meta&&k==='ArrowLeft')||k==='h')prev();
  else if((meta&&k==='ArrowUp')||k==='+'||k==='=')P.volume=Math.min(10,P.volume+1);
  else if((meta&&k==='ArrowDown')||k==='-')P.volume=Math.max(0,P.volume-1);
  else if(k==='ArrowDown'||k==='j')P.selected=Math.min(TUNES.length-1,P.selected+1);
  else if(k==='ArrowUp'||k==='k')P.selected=Math.max(0,P.selected-1);
  else if(k==='Home')P.selected=0;
  else if(k==='End'||k==='G')P.selected=TUNES.length-1;
  else if(k==='Enter'){playIndex(P.selected);P.surprise=false;}
  else if((meta&&alt&&k.toLowerCase()==='s')||k==='s')P.shuffle=!P.shuffle;
  else if((meta&&k==='R')||k==='r'){P.surprise=true;next();}
  else if((meta&&k==='.')||k==='x'){P.state='stopped';P.elapsed=0;}
  else used=false;
  if(used){e.preventDefault();drawPlayer();}
});

// ---------------------------------------------------------------------------
// The tube, in one fragment shader over the glass. The case is the photo
// behind it; the shader draws the dark glass when off, and the picture with
// the beam's scanlines, the tube's curvature, halation and the room's
// reflection when on. Power on and off are animated with the scale and
// brightness uniforms.
const PW=2400,PH=2000;                 // render coordinates
const GX0=546,GX1=1854,GY0=384,GY1=1342; // the glass of the rendered 1702
const M=60;                            // margin around the glass for the light spill
const HALF=new THREE.Vector2((GX1-GX0)/2,(GY1-GY0)/2), QUAD=new THREE.Vector2(GX1-GX0+2*M,GY1-GY0+2*M);

const canvas=document.getElementById('gl'), stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:false,premultipliedAlpha:true,preserveDrawingBuffer:true});
renderer.setClearColor(0x000000,0);
const camera=new THREE.OrthographicCamera(0,PW,0,PH,-1,1);
const tex=new THREE.CanvasTexture(frame);
tex.flipY=false;tex.generateMipmaps=true;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;
tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;tex.colorSpace=THREE.NoColorSpace;

const U={uFrame:{value:tex},uQuad:{value:QUAD},uHalf:{value:HALF},uPx:{value:1},uTime:{value:0},
  uBright:{value:0},uScale:{value:new THREE.Vector2(1,1)},uFocus:{value:0.4},uWobble:{value:0},
  uAmbient:{value:1},uSeed:{value:0},uCollapse:{value:0}};

const material=new THREE.ShaderMaterial({
  glslVersion:THREE.GLSL3,uniforms:U,transparent:true,premultipliedAlpha:true,side:THREE.DoubleSide,depthTest:false,
  vertexShader:`out vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
precision highp float;
uniform sampler2D uFrame; uniform vec2 uQuad,uHalf,uScale;
uniform float uPx,uTime,uBright,uFocus,uWobble,uAmbient,uSeed,uCollapse;
in vec2 vUv; out vec4 outColor;
const vec2 FR=vec2(384.0,272.0);
const float RASTER=0.93;   // the raster's width as a share of the glass
const float BARREL=0.07;   // lookup distortion; fitted to the reference's edge bow
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float sdBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
vec3 frameAt(vec2 t,float lod){return textureLod(uFrame,t,lod).rgb;}
// One line of the picture at texel column u (continuous): crisp texels with
// a pixel-footprint edge, softened by the monitor's video bandwidth.
vec3 lineSample(float u,float v,float lod){
  float fw=max(fwidth(u),1e-4);
  float b=floor(u+0.5);
  float us=b+clamp((u-b)/fw,-0.5,0.5);
  float y=v/FR.y;
  return 0.18*frameAt(vec2((us-0.4)/FR.x,y),lod)+0.64*frameAt(vec2(us/FR.x,y),lod)+0.18*frameAt(vec2((us+0.4)/FR.x,y),lod);
}
void main(){
  vec2 pos=(vUv-0.5)*uQuad;
  vec2 p=pos/uHalf;
  float sd=sdBox(pos,uHalf,80.0);
  float aa=1.0/uPx;
  float inGlass=1.0-smoothstep(-aa,aa,sd);

  // Where this point of the glass looks on the raster.
  vec2 q=p/RASTER;
  q*=1.0+BARREL*dot(q,q);
  q.x+=uWobble*(0.6*sin(uTime*62.0+q.y*7.0)+0.4*sin(uTime*9.0));
  q.y*=1.0+0.5*uWobble*sin(uTime*11.0);
  vec2 s=max(uScale,vec2(1e-4));
  vec2 t=(q/s)*0.5+0.5;

  vec3 pic=vec3(0.0);
  float pxLine=uPx*uHalf.y*2.0*RASTER*s.y/FR.y;   // device pixels per raster line
  if(uCollapse<0.5){
    if(t.x>-0.03&&t.x<1.03&&t.y>-0.03&&t.y<1.03){
      float foot=1.0/max(pxLine,1e-3);              // pixel footprint in lines
      float lod=clamp(log2(max(foot,1.0)),0.0,8.0);
      float ly=t.y*FR.y;
      float k0=floor(ly-0.5)-1.0;
      float u=t.x*FR.x+(hash(vec2(k0,uSeed))-0.5)*0.25; // a touch of line jitter
      vec3 acc=vec3(0.0); float wsum=0.0; float sige=0.0;
      for(int i=0;i<4;i++){
        float k=k0+float(i);
        float inside=step(0.0,k)*step(k,FR.y-1.0);
        vec3 c=lineSample(u,k+0.5,lod)*inside;
        float lum=dot(c,vec3(0.299,0.587,0.114));
        float sg=uFocus*(0.85+0.35*lum);              // bright lines bloom wider
        float s2=sg*sg+foot*foot/12.0;                // the pixel's own width
        sige=sqrt(s2);
        float d=ly-(k+0.5);
        float w=exp(-0.5*d*d/s2)/sqrt(6.2831853*s2);
        acc+=c*w; wsum+=w*inside;
      }
      // A focused beam keeps its scanline modulation; a defocused one is
      // normalized, or the picture would dim as it blurs.
      acc/=mix(1.0,max(wsum,1e-3),smoothstep(0.6,1.2,sige));
      vec2 tc=clamp(t,0.0,1.0);
      vec2 outside=max(abs(t-0.5)-0.5,0.0)*FR;
      vec3 halo=(0.10*frameAt(tc,3.0)+0.05*frameAt(tc,5.0))*exp(-length(outside)/5.0);
      pic=(acc+halo)/1.15;                            // a flat field lands on the reference color
      // Shadow mask: only when there are pixels enough to show it.
      float triad=1.12*uPx;
      float mstr=0.22*smoothstep(2.5,6.0,triad);
      float ph=mod(floor(gl_FragCoord.x/(triad/3.0)),3.0);
      vec3 stripe=vec3(ph==0.0?1.0:0.0,ph==1.0?1.0:0.0,ph==2.0?1.0:0.0);
      pic*=1.0+mstr*(stripe-1.0/3.0);
      pic*=1.0-0.08*smoothstep(0.4,1.6,dot(p,p));
      pic*=1.0+0.03*(hash(gl_FragCoord.xy+uSeed)-0.5);
    }
  }else{
    // The picture folded into a line, then a dot.
    vec2 w=max(uScale*RASTER,1.4*aa/uHalf);
    float kx=mix(2.0,6.0,smoothstep(0.0,0.1,uScale.x));
    float env=exp(-0.5*pow(abs(p.x)/w.x,kx))*exp(-0.5*pow(abs(p.y)/w.y,2.0));
    pic=frameAt(vec2(0.5),8.0)*env;
  }
  vec3 c=pic*uBright;
  float lum=dot(c,vec3(0.299,0.587,0.114));
  c+=vec3(max(lum-1.0,0.0))*0.8;                      // overdriven phosphor goes white

  // The glass: dark, a little lighter at the bottom, darker at the rim where
  // the tube falls away under the bezel, with the room reflected in it.
  vec3 base=mix(vec3(0.17,0.175,0.19),vec3(0.26,0.27,0.29),clamp(p.y*0.5+0.5,0.0,1.0));
  float rim=smoothstep(0.78,1.0,max(abs(p.x),abs(p.y)));
  base*=1.0-0.65*rim;
  vec2 h1=(p-vec2(-0.55,-0.5))/vec2(0.55,0.42);
  vec2 h2=(p-vec2(0.6,0.75))/vec2(0.9,0.5);
  vec3 glass=base+(exp(-dot(h1,h1))*0.085+exp(-dot(h2,h2))*0.03)*vec3(0.95,0.97,1.0);
  vec3 color=c+glass*uAmbient;

  // Light spilling onto the bezel around the glass.
  vec3 avg=frameAt(vec2(0.5),8.0)*uBright*(uCollapse>0.5?0.15:1.0);
  float spill=0.5*dot(avg,vec3(0.299,0.587,0.114))*exp(-max(sd,0.0)/30.0);
  float alpha=max(inGlass,min(spill,1.0));
  color=mix(avg,color,inGlass);
  outColor=vec4(color*alpha,alpha);
}`});
const screen=new THREE.Mesh(new THREE.PlaneGeometry(QUAD.x,QUAD.y),material);
screen.position.set((GX0+GX1)/2,(GY0+GY1)/2,0);
const scene=new THREE.Scene(); scene.add(screen);

function resize(){
  const r=stage.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,3);
  renderer.setPixelRatio(dpr); renderer.setSize(r.width,r.height,false);
  U.uPx.value=r.width*dpr/PW;
}
addEventListener('resize',resize); resize();

// ---------------------------------------------------------------------------
// Power. The LED is instant; the tube takes a second to warm up, then the
// raster opens from a thin band with a slight overshoot in brightness and a
// shimmy while the deflection settles. Off, the raster collapses to a line
// in about a tenth of a second, the line to a dot, and the dot fades.
let power='off', onAt=0, offAt=0;
const led=document.getElementById('led');
document.getElementById('power').addEventListener('click',()=>{
  const now=performance.now()/1000;
  if(power==='off'){power='on';onAt=now;led.classList.add('on');boot();}
  else if(power==='on'){power='dying';offAt=now;led.classList.remove('on');mode='off';schedule([]);cursor=null;}
});
function crt(now){
  let bright=0,sx=1,sy=1,focus=0.4,wobble=0,collapse=0,ambient=1;
  if(power==='on'){
    const WARM=1.0,t=now-onAt;
    if(t>WARM){
      const a=t-WARM,u=Math.min(1,a/0.7),e=1-Math.pow(1-u,3);
      sy=0.03+0.97*e; sx=0.9+0.1*e;
      const u2=Math.min(1,a/1.8);
      bright=(0.15+0.85*Math.min(1,a/0.45))*(1+0.22*Math.sin(Math.PI*u2)*(1-u2));
      focus=0.4+0.55*Math.max(0,1-a/1.4);
      wobble=0.012*Math.exp(-a*2.5);
      ambient=0.04+0.96*Math.max(0,1-a/1.5);
    }
  }else if(power==='dying'){
    const t=now-offAt; ambient=0.04+0.96*Math.min(1,t/1.5);
    if(t<0.12){const u=t/0.12;sy=1-(1-0.004)*u*u;bright=1+1.4*u;}
    else if(t<0.45){const u=(t-0.12)/0.33;collapse=1;sy=0.004;sx=1-(1-0.006)*u*u*u;bright=2.4-1.0*u;}
    else{collapse=1;sy=0.004;sx=0.006;bright=1.4*Math.exp(-(t-0.45)/0.55);if(bright<0.01){power='off';bright=0;}}
  }
  U.uBright.value=bright;U.uScale.value.set(sx,sy);U.uFocus.value=focus;U.uWobble.value=wobble;
  U.uCollapse.value=collapse;U.uAmbient.value=ambient;
}

let last=performance.now()/1000;
function tick(){
  const now=performance.now()/1000, dt=Math.min(0.1,now-last); last=now;
  if(mode==='boot')runScript(now);
  if(mode==='player'){simulate(dt,now);drawPlayer();}
  if(dirty||cursor){renderFrame(Math.floor(now*3)%2===0);tex.needsUpdate=true;dirty=false;}
  crt(now);
  U.uTime.value=now;U.uSeed.value=Math.floor(now*50)%1000;
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
cls(); tick();
</script>
