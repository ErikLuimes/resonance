# Publishes the Resonance website (apple/site) to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site is plain static files, so there's no build step.

name: Resonance site

on:
  push:
    branches: [main]
    paths:
      - "apple/site/**"
      - ".github/workflows/resonance-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apple/site
      - id: deployment
        uses: actions/deploy-pages@v4
